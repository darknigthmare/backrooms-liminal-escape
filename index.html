  <style>:root {
  color-scheme: dark;
  --bg: #05060a;
  --panel: rgba(12, 16, 24, 0.92);
  --panel-2: rgba(22, 28, 40, 0.82);
  --line: rgba(255, 255, 255, 0.14);
  --text: #eef3ff;
  --muted: #9ba7bd;
  --accent: #8df5db;
  --accent-2: #ff5a8d;
  --danger: #ff5c5c;
  --warning: #ffc85a;
  --good: #6cf59a;
  --shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 15% 10%, rgba(73, 110, 164, 0.16), transparent 32rem),
    radial-gradient(circle at 85% 90%, rgba(122, 42, 90, 0.15), transparent 30rem),
    linear-gradient(155deg, #080a10, var(--bg));
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .22;
  background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.035) 3px 4px);
  mix-blend-mode: overlay;
  z-index: 30;
}
button, input, select { font: inherit; }
a { color: inherit; }

.app-shell {
  width: min(1500px, 100%);
  margin: 0 auto;
  min-height: 100vh;
  padding: 18px;
  display: grid;
  gap: 14px;
  grid-template-rows: auto 1fr auto;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px 18px;
  background: linear-gradient(145deg, rgba(16, 20, 30, .96), rgba(9, 11, 17, .9));
  box-shadow: var(--shadow);
}
.brand { min-width: 0; }
.brand-kicker {
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .22em;
  font-size: .72rem;
  font-weight: 800;
}
h1 {
  margin: 3px 0 2px;
  font-size: clamp(1.35rem, 2.7vw, 2.55rem);
  line-height: 1;
  letter-spacing: -.04em;
}
.subtitle {
  margin: 0;
  color: var(--muted);
  max-width: 72ch;
  font-size: .94rem;
}
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

.btn {
  min-height: 42px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.06);
  color: var(--text);
  padding: 9px 13px;
  font-weight: 760;
  letter-spacing: .01em;
  cursor: pointer;
  transition: transform .14s ease, background .14s ease, border-color .14s ease, opacity .14s ease;
}
.btn:hover { transform: translateY(-1px); background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.28); }
.btn:active { transform: translateY(1px); }
.btn.primary { color: #06100e; background: var(--accent); border-color: transparent; }
.btn.danger { background: rgba(255, 70, 92, .15); border-color: rgba(255, 90, 110, .4); }
.btn.warning { background: rgba(255, 194, 68, .14); border-color: rgba(255, 194, 68, .35); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

.game-layout {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 14px;
  align-items: start;
}
.stage-card,
.side-card,
.footer-card {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 20px;
  box-shadow: var(--shadow);
}
.stage-card {
  position: relative;
  overflow: hidden;
  min-height: 0;
  aspect-ratio: 16 / 9;
  align-self: start;
  display: block;
}
.stage-card::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 90px rgba(0,0,0,.5);
}
canvas {
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  min-height: 0;
  display: block;
  touch-action: none;
  outline: none;
}
.overlay {
  position: absolute;
  inset: 0;
  z-index: 12;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(2, 3, 6, .7);
  backdrop-filter: blur(6px);
}
.overlay[hidden] { display: none; }
.overlay-panel {
  width: min(680px, 100%);
  max-height: 90%;
  overflow: auto;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 22px;
  padding: 24px;
  background: linear-gradient(160deg, rgba(23,28,40,.97), rgba(8,10,16,.97));
  box-shadow: 0 25px 90px rgba(0,0,0,.65);
}
.overlay-title { margin: 0 0 9px; font-size: clamp(1.6rem, 4vw, 3rem); line-height: .98; }
.overlay-copy { color: #c6cfde; line-height: 1.58; }
.overlay-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }

.side-card {
  padding: 14px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.panel-section {
  border: 1px solid rgba(255,255,255,.1);
  background: var(--panel-2);
  border-radius: 15px;
  padding: 12px;
}
.panel-title {
  margin: 0 0 10px;
  font-size: .74rem;
  text-transform: uppercase;
  letter-spacing: .18em;
  color: var(--accent);
}
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.status-item {
  min-width: 0;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(0,0,0,.23);
  border-radius: 11px;
  padding: 9px;
}
.status-label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
.status-value { margin-top: 4px; font-weight: 850; overflow-wrap: anywhere; }
.meter { height: 8px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.08); margin-top: 7px; }
.meter > i { display: block; width: 50%; height: 100%; background: var(--accent); border-radius: inherit; transition: width .2s ease; }
.objective { color: #e8edf7; line-height: 1.45; }
.objective strong { color: var(--warning); }
.log {
  flex: 1;
  min-height: 150px;
  max-height: 270px;
  overflow: auto;
  display: flex;
  flex-direction: column-reverse;
  gap: 6px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .75rem;
}
.log-line { border-left: 2px solid rgba(255,255,255,.18); padding: 4px 0 4px 8px; color: #b8c2d3; }
.log-line.good { border-color: var(--good); color: #c7ffdc; }
.log-line.bad { border-color: var(--danger); color: #ffd0d0; }
.log-line.warn { border-color: var(--warning); color: #ffe8b5; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.action-grid .btn.wide { grid-column: 1 / -1; }

.footer-card {
  padding: 10px 12px;
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
.controls-copy { color: var(--muted); font-size: .82rem; }
.badges { display: flex; gap: 7px; flex-wrap: wrap; }
.badge {
  border: 1px solid rgba(255,255,255,.13);
  background: rgba(255,255,255,.05);
  color: #c9d2e2;
  border-radius: 999px;
  padding: 6px 9px;
  font-size: .73rem;
}

.touch-pad {
  display: none;
  position: absolute;
  z-index: 8;
  left: 14px;
  right: 14px;
  bottom: 14px;
  pointer-events: none;
  justify-content: space-between;
  align-items: end;
}
.touch-cluster { display: grid; gap: 5px; pointer-events: auto; }
.touch-cluster.dpad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 48px); }
.touch-cluster.actions { grid-template-columns: repeat(2, 64px); }
.touch-btn {
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(5,8,14,.7);
  color: #fff;
  border-radius: 14px;
  min-height: 46px;
  font-weight: 900;
  backdrop-filter: blur(5px);
  touch-action: none;
  user-select: none;
}
.touch-btn:active, .touch-btn.active { background: var(--accent); color: #06100e; }
.touch-spacer { visibility: hidden; }

.hub {
  width: min(1220px, 100%);
  margin: 0 auto;
  padding: 30px 18px 60px;
}
.hub-hero {
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: clamp(24px, 5vw, 58px);
  background: linear-gradient(140deg, rgba(20,26,39,.96), rgba(8,10,15,.95));
  box-shadow: var(--shadow);
}
.hub-hero h1 { font-size: clamp(2.1rem, 7vw, 5.2rem); max-width: 12ch; }
.hub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
.game-card {
  min-height: 250px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 10px;
  padding: 20px;
  border-radius: 22px;
  border: 1px solid var(--line);
  background:
    radial-gradient(circle at 70% 10%, var(--card-glow, rgba(141,245,219,.18)), transparent 52%),
    linear-gradient(155deg, rgba(23,28,40,.96), rgba(8,10,15,.96));
  box-shadow: var(--shadow);
  text-decoration: none;
  transition: transform .18s ease, border-color .18s ease;
}
.game-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.32); }
.game-card small { text-transform: uppercase; letter-spacing: .16em; color: var(--accent); font-weight: 850; }
.game-card h2 { margin: 0; font-size: 1.55rem; }
.game-card p { margin: 0; color: var(--muted); line-height: 1.5; }
.game-card .launch { margin-top: 4px; color: #fff; font-weight: 800; }
.hub-note { color: var(--muted); margin-top: 18px; line-height: 1.5; }

body[data-game="arcade-null"] { --accent: #5fffe1; --accent-2: #ff3d88; }
body[data-game="kidz-tv-after-hours"] { --accent: #ffe85c; --accent-2: #ff59c7; }
body[data-game="l-envers-service-de-nuit"] { --accent: #9d8cff; --accent-2: #ff5c6e; }

body[data-game="chord-of-dread"] { --accent: #ff5b5b; --accent-2: #b55cff; }

@media (max-width: 1000px) {
  .game-layout { grid-template-columns: 1fr; }
  .side-card { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); }
  .side-card .panel-section:last-child { grid-column: 1 / -1; }
  .hub-grid { grid-template-columns: repeat(2, 1fr); }
  .stage-card { min-height: 0; }
}
@media (max-width: 700px) {
  .app-shell { padding: 8px; gap: 8px; }
  .topbar { border-radius: 15px; padding: 12px; align-items: flex-start; }
  .top-actions { flex-direction: column; }
  .top-actions .btn { min-height: 36px; padding: 6px 9px; }
  .stage-card, .side-card, .footer-card { border-radius: 15px; }
  .stage-card { min-height: 0; }
  canvas { min-height: 0; }
  .side-card { display: flex; }
  .hub-grid { grid-template-columns: 1fr; }
  .touch-pad { display: flex; }
  .footer-card { padding-bottom: 8px; }
}
@media (pointer: coarse) {
  .touch-pad { display: flex; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .001ms !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
}

class AudioBus {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.enabled = true;
    this.volume = 0.55;
  }
  ensure() {
    if (!this.enabled) return null;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.volume;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
    return this.ctx;
  }
  setEnabled(v) {
    this.enabled = v;
    if (this.master) this.master.gain.value = v ? this.volume : 0;
  }
  tone(freq = 220, duration = 0.08, type = "sine", volume = 0.12, delay = 0, slide = 0) {
    const ctx = this.ensure();
    if (!ctx || !this.master) return;
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, freq), t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + duration);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), t + Math.min(0.02, duration / 3));
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain).connect(this.master);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }
  noise(duration = 0.12, volume = 0.08, delay = 0, filterFreq = 1200) {
    const ctx = this.ensure();
    if (!ctx || !this.master) return;
    const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    const t = ctx.currentTime + delay;
    src.buffer = buffer;
    filter.type = "lowpass";
    filter.frequency.value = filterFreq;
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    src.connect(filter).connect(gain).connect(this.master);
    src.start(t);
  }
  chord(freqs, duration = 0.18, type = "triangle", volume = 0.08) {
    freqs.forEach((f, i) => this.tone(f, duration, type, volume / Math.max(1, freqs.length * .72), i * .006));
  }
}

class InputState {
  constructor(canvas) {
    this.canvas = canvas;
    this.keys = new Set();
    this.pressed = new Set();
    this.pointer = { x: 480, y: 270, down: false, clicked: false };
    this.onKeyDown = null;
    this.onPointer = null;
    window.addEventListener("keydown", (e) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
      if (!this.keys.has(e.code)) this.pressed.add(e.code);
      this.keys.add(e.code);
      this.onKeyDown?.(e.code, e);
    }, { passive: false });
    window.addEventListener("keyup", (e) => this.keys.delete(e.code));
    window.addEventListener("blur", () => this.keys.clear());
    const update = (e) => {
      const rect = canvas.getBoundingClientRect();
      this.pointer.x = clamp((e.clientX - rect.left) / Math.max(1, rect.width) * canvas.width, 0, canvas.width);
      this.pointer.y = clamp((e.clientY - rect.top) / Math.max(1, rect.height) * canvas.height, 0, canvas.height);
    };
    canvas.addEventListener("pointermove", update);
    canvas.addEventListener("pointerdown", (e) => {
      update(e);
      this.pointer.down = true;
      this.pointer.clicked = true;
      canvas.setPointerCapture?.(e.pointerId);
      this.onPointer?.("down", this.pointer, e);
    });
    canvas.addEventListener("pointerup", (e) => {
      update(e);
      this.pointer.down = false;
      this.onPointer?.("up", this.pointer, e);
    });
  }
  is(...codes) { return codes.some((c) => this.keys.has(c)); }
  hit(...codes) { return codes.some((c) => this.pressed.has(c)); }
  virtualDown(code) {
    if (!this.keys.has(code)) this.pressed.add(code);
    this.keys.add(code);
    this.onKeyDown?.(code, { virtual: true, preventDefault() {} });
  }
  virtualUp(code) { this.keys.delete(code); }
  endFrame() {
    this.pressed.clear();
    this.pointer.clicked = false;
  }
}

class GameHost {
  constructor(slug) {
    this.slug = slug;
    this.meta = GAME_META[slug];
    this.audio = new AudioBus();
    this.paused = false;
    this.logs = [];
    this.game = null;
    this.last = performance.now();
    this.installShell();
    this.input = new InputState(this.canvas);
    this.input.onKeyDown = (code, event) => {
      this.audio.ensure();
      if (code === "Escape" && !event.virtual) this.togglePause();
      this.game?.onKeyDown?.(code, event);
    };
    this.input.onPointer = (type, p, event) => {
      this.audio.ensure();
      this.game?.onPointer?.(type, p, event);
    };
    this.bindGlobalButtons();
    requestAnimationFrame((t) => this.frame(t));
  }
  installShell() {
    const m = this.meta;
    document.body.innerHTML = `
      <div class="app-shell">
        <header class="topbar">
          <div class="brand">
            <div class="brand-kicker">${escapeHtml(m.kicker)}</div>
            <h1>${escapeHtml(m.title)}</h1>
            <p class="subtitle">${escapeHtml(m.subtitle)}</p>
          </div>
          <div class="top-actions">
            <a class="btn" href="../">Collection</a>
            <button class="btn" id="audioBtn">Audio : oui</button>
            <button class="btn" id="pauseBtn">Pause</button>
            <button class="btn danger" id="resetBtn">Nouvelle partie</button>
          </div>
        </header>
        <main class="game-layout">
          <section class="stage-card">
            <canvas id="gameCanvas" width="960" height="540" tabindex="0" aria-label="Zone de jeu"></canvas>
            <div class="overlay" id="overlay" hidden><div class="overlay-panel" id="overlayPanel"></div></div>
            <div class="touch-pad" id="touchPad">
              <div class="touch-cluster dpad">
                <span class="touch-spacer"></span><button class="touch-btn" data-key="ArrowUp">▲</button><span class="touch-spacer"></span>
                <button class="touch-btn" data-key="ArrowLeft">◀</button><span class="touch-spacer"></span><button class="touch-btn" data-key="ArrowRight">▶</button>
                <span class="touch-spacer"></span><button class="touch-btn" data-key="ArrowDown">▼</button><span class="touch-spacer"></span>
              </div>
              <div class="touch-cluster actions">
                <button class="touch-btn" data-key="KeyE">E</button>
                <button class="touch-btn" data-key="Space">A</button>
                <button class="touch-btn" data-key="KeyB">B</button>
                <button class="touch-btn" data-key="Enter">OK</button>
              </div>
            </div>
          </section>
          <aside class="side-card">
            <section class="panel-section">
              <h2 class="panel-title">État</h2>
              <div class="status-grid" id="statusGrid"></div>
            </section>
            <section class="panel-section">
              <h2 class="panel-title">Objectif</h2>
              <div class="objective" id="objective">Initialisation…</div>
            </section>
            <section class="panel-section">
              <h2 class="panel-title">Actions</h2>
              <div class="action-grid" id="actionGrid"></div>
            </section>
            <section class="panel-section" style="min-height:0;display:flex;flex-direction:column">
              <h2 class="panel-title">Journal</h2>
              <div class="log" id="log"></div>
            </section>
          </aside>
        </main>
        <footer class="footer-card">
          <div class="controls-copy">${escapeHtml(m.controls)}</div>
          <div class="badges">${m.badges.map((b) => `<span class="badge">${escapeHtml(b)}</span>`).join("")}</div>
        </footer>
      </div>`;
    this.canvas = document.querySelector("#gameCanvas");
    this.ctx = this.canvas.getContext("2d", { alpha: false });
    this.overlay = document.querySelector("#overlay");
    this.overlayPanel = document.querySelector("#overlayPanel");
    this.statusGrid = document.querySelector("#statusGrid");
    this.objective = document.querySelector("#objective");
    this.actionGrid = document.querySelector("#actionGrid");
    this.logEl = document.querySelector("#log");
  }
  bindGlobalButtons() {
    document.querySelector("#audioBtn").addEventListener("click", (e) => {
      this.audio.setEnabled(!this.audio.enabled);
      e.currentTarget.textContent = `Audio : ${this.audio.enabled ? "oui" : "non"}`;
      if (this.audio.enabled) this.audio.tone(440, .06, "sine", .08);
    });
    document.querySelector("#pauseBtn").addEventListener("click", () => this.togglePause());
    document.querySelector("#resetBtn").addEventListener("click", () => this.confirmReset());
    document.querySelectorAll(".touch-btn[data-key]").forEach((btn) => {
      const key = btn.dataset.key;
      const down = (e) => { e.preventDefault(); btn.classList.add("active"); this.audio.ensure(); this.input.virtualDown(key); };
      const up = (e) => { e.preventDefault(); btn.classList.remove("active"); this.input.virtualUp(key); };
      btn.addEventListener("pointerdown", down);
      btn.addEventListener("pointerup", up);
      btn.addEventListener("pointercancel", up);
      btn.addEventListener("pointerleave", (e) => { if (e.buttons) up(e); });
    });
  }
  mount(game) {
    this.game = game;
    game.host = this;
    game.start?.();
  }
  frame(now) {
    const dt = clamp((now - this.last) / 1000, 0, .05);
    this.last = now;
    if (!this.paused && this.game && this.overlay.hidden) this.game.update?.(dt);
    this.game?.render?.(this.ctx);
    this.input.endFrame();
    requestAnimationFrame((t) => this.frame(t));
  }
  togglePause() {
    if (!this.overlay.hidden) return;
    this.paused = !this.paused;
    document.querySelector("#pauseBtn").textContent = this.paused ? "Reprendre" : "Pause";
    if (this.paused) {
      this.showOverlay("Pause", "La partie est suspendue. Les sons et la simulation reprendront lorsque vous fermerez cet écran.", [
        { label: "Reprendre", primary: true, action: () => { this.hideOverlay(); this.paused = false; document.querySelector("#pauseBtn").textContent = "Pause"; } },
      ]);
    }
  }
  confirmReset() {
    this.showOverlay("Nouvelle partie ?", "La progression de cette partie sera remplacée. Les records globaux resteront conservés.", [
      { label: "Annuler", action: () => this.hideOverlay() },
      { label: "Recommencer", danger: true, action: () => { this.hideOverlay(); this.game?.reset?.(); } },
    ]);
  }
  showOverlay(title, html, buttons = []) {
    this.overlayPanel.innerHTML = `<h2 class="overlay-title">${escapeHtml(title)}</h2><div class="overlay-copy">${html}</div><div class="overlay-actions"></div>`;
    const actions = this.overlayPanel.querySelector(".overlay-actions");
    buttons.forEach((b) => {
      const btn = document.createElement("button");
      btn.className = `btn${b.primary ? " primary" : ""}${b.danger ? " danger" : ""}`;
      btn.textContent = b.label;
      btn.addEventListener("click", () => { this.audio.ensure(); b.action?.(); });
      actions.append(btn);
    });
    this.overlay.hidden = false;
  }
  hideOverlay() { this.overlay.hidden = true; }
  setStatus(items) {
    this.statusGrid.innerHTML = "";
    for (const item of items) {
      const el = document.createElement("div");
      el.className = "status-item";
      const meter = item.meter == null ? "" : `<div class="meter"><i style="width:${clamp(item.meter,0,100)}%;background:${item.color || "var(--accent)"}"></i></div>`;
      el.innerHTML = `<div class="status-label">${escapeHtml(item.label)}</div><div class="status-value">${escapeHtml(item.value)}</div>${meter}`;
      this.statusGrid.append(el);
    }
  }
  setObjective(html) { this.objective.innerHTML = html; }
  setActions(actions) {
    this.actionGrid.innerHTML = "";
    actions.forEach((a) => {
      const btn = document.createElement("button");
      btn.className = `btn${a.primary ? " primary" : ""}${a.danger ? " danger" : ""}${a.warning ? " warning" : ""}${a.wide ? " wide" : ""}`;
      btn.textContent = a.label;
      btn.disabled = !!a.disabled;
      btn.addEventListener("click", () => { this.audio.ensure(); a.action?.(); });
      this.actionGrid.append(btn);
    });
  }
  log(message, kind = "") {
    this.logs.unshift({ message, kind, at: Date.now() });
    this.logs = this.logs.slice(0, 35);
    this.logEl.innerHTML = this.logs.map((l) => `<div class="log-line ${l.kind}">${escapeHtml(l.message)}</div>`).join("");
  }
  save(key, data) {
    try { localStorage.setItem(`aug2.${this.slug}.${key}`, JSON.stringify(data)); } catch {}
  }
  load(key, fallback = null) {
    try {
      const raw = localStorage.getItem(`aug2.${this.slug}.${key}`);
      return raw ? JSON.parse(raw) : fallback;
    } catch { return fallback; }
  }
  clearSave(key) { try { localStorage.removeItem(`aug2.${this.slug}.${key}`); } catch {} }
  shake(amount = 7, duration = 180) {
    const stage = this.canvas.closest(".stage-card");
    const start = performance.now();
    const tick = () => {
      const p = (performance.now() - start) / duration;
      if (p >= 1) { stage.style.transform = ""; return; }
      stage.style.transform = `translate(${rand(-amount, amount) * (1-p)}px, ${rand(-amount, amount) * (1-p)}px)`;
      requestAnimationFrame(tick);
    };
    tick();
  }
}

class BaseGame {
  constructor(host) { this.host = host; this.w = 960; this.h = 540; this.time = 0; }
  start() {}
  update(dt) { this.time += dt; }
  render(ctx) { ctx.fillStyle = "#05070b"; ctx.fillRect(0, 0, this.w, this.h); }
  reset() {}
  onKeyDown() {}
  onPointer() {}
  vignette(ctx, strength = .55) {
    const g = ctx.createRadialGradient(this.w/2, this.h/2, 80, this.w/2, this.h/2, this.w*.68);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, `rgba(0,0,0,${strength})`);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,this.w,this.h);
  }
  scanlines(ctx, alpha = .07) {
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    for (let y=0; y<this.h; y+=4) ctx.fillRect(0,y,this.w,1);
  }
}


class ArcadeNullGame extends BaseGame {
  constructor(host) {
    super(host);
    this.anomalyNames = [
      "La rangée B compte une borne supplémentaire.",
      "Le néon ASTERION est rouge au lieu de cyan.",
      "L’horloge affiche 03:33 et ne bouge plus.",
      "Le reflet du couloir ne contient pas la porte.",
      "La mascotte en carton regarde la caméra.",
      "La borne VOID//RUNNER est déjà allumée.",
      "Une silhouette se tient derrière la vitre.",
      "Le sol quadrillé converge dans le mauvais sens.",
      "Le tableau des scores porte votre nom avant la partie.",
    ];
    this.reset(true);
  }
  reset(first = false) {
    this.mode = "inspection";
    this.loop = 1;
    this.rank = 10;
    this.totalScore = 0;
    this.stability = 100;
    this.correct = 0;
    this.wrong = 0;
    this.roomSeed = Math.random();
    this.anomaly = null;
    this.runner = null;
    this.ending = null;
    this.host.logs = [];
    this.host.logEl.innerHTML = "";
    this.newRoom();
    this.syncUI();
    if (!first) this.host.log("Protocole réinitialisé. La salle vous reconnaît encore.", "warn");
    this.host.showOverlay(
      "Règle du protocole",
      `<p>Chaque boucle commence dans la même salle d’arcade. <strong>Si quelque chose a changé, ressortez.</strong> Si tout est normal, asseyez-vous à la borne VOID//RUNNER et marquez assez de points pour remonter le classement.</p>
       <p>Une mauvaise décision dégrade la stabilité. Atteignez le <strong>rang n°1</strong> avant qu’elle ne tombe à zéro.</p>`,
      [{ label: "Entrer dans Asterion Arcade", primary: true, action: () => { this.host.hideOverlay(); this.host.audio.chord([110,165,220], .45, "sawtooth", .1); } }]
    );
  }
  newRoom() {
    const chance = clamp(.38 + this.loop * .035, .38, .72);
    this.anomaly = Math.random() < chance ? {
      text: pick(this.anomalyNames),
      slot: randi(0, 8),
      kind: randi(0, 5),
    } : null;
    this.roomSeed = Math.random();
    this.mode = "inspection";
    this.host.log(`Boucle ${this.loop} : portes verrouillées derrière vous.`);
  }
  decide(foundAnomaly) {
    if (this.mode !== "inspection") return;
    const correct = foundAnomaly === !!this.anomaly;
    if (correct) {
      this.correct++;
      this.stability = clamp(this.stability + 5, 0, 100);
      this.host.audio.tone(foundAnomaly ? 180 : 520, .13, foundAnomaly ? "square" : "triangle", .12, 0, foundAnomaly ? -60 : 100);
      if (foundAnomaly) {
        this.host.log(`Anomalie confirmée : ${this.anomaly.text}`, "good");
        this.totalScore += 1300 + this.loop * 150;
        this.advanceLoop();
      } else {
        this.host.log("Salle conforme. VOID//RUNNER accepte votre jeton.", "good");
        this.startRunner();
      }
    } else {
      this.wrong++;
      this.stability = clamp(this.stability - 24, 0, 100);
      this.totalScore = Math.max(0, this.totalScore - 1800);
      this.host.audio.noise(.42, .16, 0, 700);
      this.host.shake(13, 320);
      this.host.log(this.anomaly ? `Erreur : vous avez joué malgré l’anomalie — ${this.anomaly.text}` : "Erreur : vous avez fui une salle parfaitement normale.", "bad");
      if (this.stability <= 0) this.finish("absorbed");
      else this.advanceLoop(false);
    }
    this.syncUI();
  }
  advanceLoop(reward = true) {
    this.loop++;
    if (reward) this.totalScore += 450;
    if (this.loop > 14 && this.rank > 1) this.finish("locked");
    else setTimeout(() => { if (!this.ending) { this.newRoom(); this.syncUI(); } }, 280);
  }
  startRunner() {
    this.mode = "runner";
    this.runner = {
      t: 0,
      duration: 19 + Math.min(7, this.loop * .7),
      x: 480,
      y: 420,
      vx: 0,
      vy: 0,
      score: 0,
      combo: 0,
      lives: 3,
      spawn: 0,
      stars: Array.from({length: 80}, () => ({x:rand(0,960), y:rand(0,540), s:rand(1,3), v:rand(50,180)})),
      objects: [],
      trail: [],
    };
    this.host.setObjective(`<strong>VOID//RUNNER :</strong> survivez ${Math.ceil(this.runner.duration)} secondes, ramassez les fragments cyan et évitez les blocs magenta.`);
    this.host.setActions([
      { label: "Quitter la borne", danger: true, wide: true, action: () => { this.stability -= 18; this.host.log("Vous avez abandonné la partie. La borne conserve votre reflet.", "bad"); this.advanceLoop(false); } },
    ]);
    this.host.audio.chord([220,330,440], .25, "square", .08);
  }
  runnerHit(obj) {
    const r = this.runner;
    if (obj.type === "coin") {
      obj.dead = true;
      r.combo++;
      const gain = 350 + Math.min(1200, r.combo * 55);
      r.score += gain;
      this.host.audio.tone(420 + r.combo * 12, .07, "triangle", .08, 0, 120);
    } else if (!obj.hit) {
      obj.hit = true;
      obj.dead = true;
      r.lives--;
      r.combo = 0;
      r.score = Math.max(0, r.score - 900);
      this.stability = clamp(this.stability - 7, 0, 100);
      this.host.audio.noise(.2, .14, 0, 500);
      this.host.shake(8, 180);
      if (r.lives <= 0) r.t = r.duration;
    }
  }
  endRunner() {
    const r = this.runner;
    const earned = Math.round(r.score + r.lives * 1400 + this.loop * 320);
    this.totalScore += earned;
    const improvement = Math.max(1, Math.floor(earned / 6500));
    const old = this.rank;
    this.rank = Math.max(1, this.rank - improvement);
    this.host.log(`VOID//RUNNER : +${fmt(earned)} points. Rang ${old} → ${this.rank}.`, "good");
    this.mode = "result";
    if (this.rank === 1) {
      this.finish(this.stability >= 65 && this.wrong === 0 ? "perfect" : "champion");
      return;
    }
    this.host.showOverlay(
      `Rang n°${this.rank}`,
      `<p>Score de la session : <strong>${fmt(earned)}</strong></p><p>La salle se réorganise. Les sorties ne mènent plus tout à fait au même couloir.</p>`,
      [{ label: "Boucle suivante", primary: true, action: () => { this.host.hideOverlay(); this.advanceLoop(); } }]
    );
    this.syncUI();
  }
  finish(type) {
    this.ending = type;
    this.mode = "ending";
    const record = this.host.load("record", { score: 0, endings: [] });
    record.score = Math.max(record.score || 0, this.totalScore);
    record.endings = [...new Set([...(record.endings || []), type])];
    this.host.save("record", record);
    const endings = {
      perfect: ["FIN S — LE NOM AU SOMMET", "Vous inscrivez le score impossible sans commettre une seule erreur. À l’aube, Asterion Arcade n’existe plus, mais votre nom apparaît sur toutes les bornes éteintes de la ville."],
      champion: ["FIN A — HIGH SCORE PROTOCOL", "Vous atteignez la première place. La porte s’ouvre sur le matin. Derrière vous, VOID//RUNNER continue de jouer avec un vaisseau qui reproduit chacun de vos mouvements."],
      locked: ["FIN B — CRÉDITS INFINIS", "Vous avez trop longtemps accepté les boucles. Le classement se remplit de vos propres variantes. La salle vous attribue un numéro de série."],
      absorbed: ["FIN C — PLAYER TWO", "La stabilité tombe à zéro. Votre reflet traverse la vitre de la borne et prend votre place. Quelqu’un d’autre entrera bientôt."],
    };
    const [title, text] = endings[type];
    this.host.showOverlay(title, `<p>${text}</p><p>Score total : <strong>${fmt(this.totalScore)}</strong> · Boucles : <strong>${this.loop}</strong> · Décisions justes : <strong>${this.correct}</strong></p>`, [
      { label: "Rejouer", primary: true, action: () => { this.host.hideOverlay(); this.reset(); } },
      { label: "Collection", action: () => location.href = "../" },
    ]);
    this.host.log(title, type === "absorbed" ? "bad" : "good");
    this.syncUI();
  }
  update(dt) {
    this.time += dt;
    if (this.mode !== "runner" || !this.runner) return;
    const r = this.runner;
    r.t += dt;
    const input = this.host.input;
    const ax = (input.is("ArrowRight", "KeyD") ? 1 : 0) - (input.is("ArrowLeft", "KeyA", "KeyQ") ? 1 : 0);
    const ay = (input.is("ArrowDown", "KeyS") ? 1 : 0) - (input.is("ArrowUp", "KeyW", "KeyZ") ? 1 : 0);
    r.vx = lerp(r.vx, ax * 350, 1 - Math.pow(.001, dt));
    r.vy = lerp(r.vy, ay * 300, 1 - Math.pow(.001, dt));
    r.x = clamp(r.x + r.vx * dt, 40, 920);
    r.y = clamp(r.y + r.vy * dt, 80, 500);
    r.trail.push({x:r.x, y:r.y, life:1});
    if (r.trail.length > 28) r.trail.shift();
    r.trail.forEach(t => t.life -= dt * 2.7);
    r.stars.forEach(s => { s.y += s.v * dt; if (s.y > 550) { s.y = -10; s.x = rand(0,960); } });
    r.spawn -= dt;
    if (r.spawn <= 0) {
      r.spawn = clamp(.55 - this.loop * .018, .23, .55);
      const type = Math.random() < .42 ? "coin" : "hazard";
      r.objects.push({type, x:rand(35,925), y:-35, vy:rand(130,230) + this.loop*8, r:type === "coin" ? 12 : rand(17,28), rot:rand(0,TAU), dead:false});
    }
    for (const o of r.objects) {
      o.y += o.vy * dt;
      o.rot += dt * 2.2;
      if (!o.dead && dist(o.x,o.y,r.x,r.y) < o.r + 15) this.runnerHit(o);
    }
    r.objects = r.objects.filter(o => !o.dead && o.y < 590);
    r.score += dt * (120 + r.combo * 5);
    if (r.t >= r.duration) this.endRunner();
    this.syncUI();
  }
  syncUI() {
    const record = this.host.load("record", { score: 0, endings: [] });
    this.host.setStatus([
      { label: "Boucle", value: this.loop },
      { label: "Rang", value: `n°${this.rank}` },
      { label: "Score", value: fmt(this.totalScore) },
      { label: "Stabilité", value: `${Math.round(this.stability)} %`, meter: this.stability, color: this.stability < 35 ? "var(--danger)" : "var(--accent)" },
      { label: "Record", value: fmt(record?.score || 0) },
      { label: "Fins", value: `${record?.endings?.length || 0}/4` },
    ]);
    if (this.mode === "inspection") {
      this.host.setObjective(`<strong>Inspection :</strong> comparez la salle à votre souvenir. Si elle est normale, jouez. Si elle contient une anomalie, ressortez.`);
      this.host.setActions([
        { label: "Jouer à la borne", primary: true, action: () => this.decide(false) },

      {label:"Ouvrir la fréquence",primary:true,action:()=>{this.host.hideOverlay();this.beginSong();}}

  }
  drawBoss(ctx){
    const b={...this.boss,type:"boss"},s=this.projected(b);ctx.save();ctx.translate(s.x,s.y);const size=s.size;ctx.globalAlpha=.9;ctx.fillStyle="rgba(0,0,0,.45)";ctx.beginPath();ctx.ellipse(0,size*.9,size*.78,size*.17,0,0,TAU);ctx.fill();ctx.fillStyle=this.boss.flash>0?"#fff":"#07050d";ctx.shadowBlur=this.boss.attack>0?48:26;ctx.shadowColor=this.boss.phase===1?"#7d65ff":this.boss.phase===2?"#ff4e83":"#ff1f48";ctx.beginPath();ctx.arc(0,-size*.25,size*.32,0,TAU);ctx.fill();ctx.fillRect(-size*.28,0,size*.56,size*.9);ctx.shadowBlur=0;ctx.strokeStyle=this.boss.phase===1?"#9886ff":this.boss.phase===2?"#ff6e9a":"#ff3d5f";ctx.lineWidth=Math.max(2,size*.025);for(let i=0;i<6+this.boss.phase*2;i++){const a=-Math.PI*.85+i/(5+this.boss.phase*2)*Math.PI*1.7;ctx.beginPath();ctx.moveTo(Math.cos(a)*size*.28,Math.sin(a)*size*.28-size*.25);ctx.lineTo(Math.cos(a)*size*.54,Math.sin(a)*size*.54-size*.25);ctx.stroke();}
